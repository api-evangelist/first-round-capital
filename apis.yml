aid: first-round-capital
name: First Round Capital
description: >-
  First Round Capital is a seed-stage venture capital firm founded in 2004 by
  Josh Kopelman and Howard Morgan, headquartered in San Francisco with offices
  in New York and Philadelphia. First Round invests almost exclusively at the
  earliest stages of company creation, typically writing lead checks in the
  $750K to $4M range, and partners (many of them former founders) work
  side-by-side with companies through their first few years. The firm is a
  generalist that seeks contrarian insight into how markets work, with concentration
  in enterprise software, AI, fintech, healthcare, hardware, and consumer. Since
  founding it has backed 500+ startups and was the first institutional investor in
  Uber; its portfolio includes Notion, Roblox, Square, Looker, Upstart, Verkada,
  Warby Parker, Flatiron Health, and Clay. First Round also runs The Review, a
  widely read operator-focused editorial publication, and self-reports roughly
  $2.5B in assets under management.
